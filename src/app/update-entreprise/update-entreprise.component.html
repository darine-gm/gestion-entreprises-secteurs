<div class="container">

  <div>
    <h2>Modifier un Entreprise :</h2>
  </div>

  <form>

    <div class="col-sm-2 col-md-2 col-lg-2">
      <label>ID Entreprise</label>

      <input readonly type="text" [(ngModel)]="currentEntreprise.idEntreprise" name="idEntreprise" class="form-control">
    </div>

    <div class="col-sm-4 col-md-4 col-lg-4">
      <label>Nom Entreprise</label>

      <input type="text" [(ngModel)]="currentEntreprise.nomEntreprise" name="nomEntreprise" class="form-control">
    </div>
<div class="col-sm-4 col-md-4 col-lg-4">
  <label>Adresse Entreprise</label>

  <input type="text"
         [(ngModel)]="currentEntreprise.adresse"
         name="adresse"
         class="form-control">
</div>

<div class="col-sm-4 col-md-4 col-lg-4">
  <label>Chiffre d'affaires</label>

  <input type="number"
         [(ngModel)]="currentEntreprise.chiffreAffaires"
         name="chiffreAffaires"
         class="form-control">
</div>

    <!--<div class="col-sm-4 col-md-4 col-lg-4">
      <label>Date création</label>

      <input type="date" [(ngModel)]="currentEntreprise.dateCreation" name="dateCreation" class="form-control">
    </div>-->

    <div class="col-sm-4 col-md-4 col-lg-4">
        <label>Data creation</label>
        <input type="date" [ngModel]="currentEntreprise.dateCreation | date: 'yyyy-MM-dd'" (ngModelChange)="currentEntreprise.dateCreation=$event" name="dateCreation" class="form-control">

    </div>
    <div class="col-sm-4 col-md-4 col-lg-4">
    <label>Secteur</label>
    <select class="form-control form-control-lg" id="idSecteur"
        name="idSecteur" [(ngModel)]="updatedSecId">
        @for (sec of secteurs; track sec.idSecteur) {
            <option [value]="sec.idSecteur">
                {{sec.nomSecteur}}
            </option>
        }
    </select>
</div>

    <div class="mt-2">
      <button type="submit" (click)="updateEntreprise()" class="btn btn-success">
        Modifier
      </button>
    </div>

  </form>

</div>
